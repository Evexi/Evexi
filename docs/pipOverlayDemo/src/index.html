<!DOCTYPE html>
<html>

<head>
  <title>Evexi API Demo - PIP Overlay Content</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #rss-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      overflow: hidden;
      background: linear-gradient(90deg, #c8102e, #ffcc00);
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }

    #rss-content {
      display: inline-block;
      white-space: nowrap;
      animation: scrollLeft linear infinite;
    }

    .headline {
      display: inline-block;
      padding: 0 40px;
      border-right: 1px solid rgba(255,255,255,0.3);
    }

    @keyframes scrollLeft {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
  </style>
</head>

<body>
  <h2>Evexi API Demo - PIP Overlay Content</h2>

  <div id="rss-container">
    <div id="rss-content"></div>
  </div>

  <div id="logs"></div>
  <script type="module" src="index.ts"></script>
</body>

</html>
