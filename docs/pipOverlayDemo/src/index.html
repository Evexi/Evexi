<!DOCTYPE html>
<html>

<head>
  <title>Evexi API Demo - PIP Overlay Content</title>
  <style>

    @font-face {
      font-family: 'Reith';
      src: url('assets/BBCReithSerif_W_Rg.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'Reith', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
    }

    #rss-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-sizing: border-box;
    }

    #logo {
      flex-shrink: 0;
      width: 120px;
      height: auto;
      max-height: 100px;
      object-fit: contain;
      margin-left: 10px;
      margin-right: 20px;
    }

    #rss-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      margin: 0 20px;
    }

    #rss-content {
      display: inline-block;
      white-space: nowrap;
      animation: scrollLeft linear infinite;
    }

    .headline {
      display: inline-block;
      padding: 0 40px;
      border-right: 1px solid rgba(0,0,0,0.4);
      font-size: 24px;
    }

    #time-display {
      flex-shrink: 0;
      font-size: 32px;
      font-weight: bold;
      min-width: 120px;
      text-align: center;
    }

    @keyframes scrollLeft {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <div id="rss-container">
    <img id="logo" src="assets/bbc.png" alt="BBC Logo" />
    <div id="rss-wrapper">
      <div id="rss-content"></div>
    </div>
    <div id="time-display">00:00</div>
  </div>
  <script type="module" src="index.ts"></script>
</body>

</html>
